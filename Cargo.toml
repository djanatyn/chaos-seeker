[workspace]
resolver = "3"
members = [
  "chaos_seeker",
  "debugger",
]

[workspace.dependencies]
anyhow = "1.0.98"
tetanes-core = "0.12.2"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
thiserror = "2.0.12"
strum = { version = "0.28.0", features = ["derive"] }
insta = { version = "1.49.0", features = ["yaml"] }
